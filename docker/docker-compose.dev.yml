services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cartero
      POSTGRES_PASSWORD: cartero
      POSTGRES_DB: cartero
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
