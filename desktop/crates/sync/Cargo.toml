[package]
name = "cartero-sync"
description = "Sincronización de la app de escritorio con un servidor de Cartero"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cartero-http = { path = "../http" }
cartero-model = { path = "../model" }
cartero-store = { path = "../store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
