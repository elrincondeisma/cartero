[package]
name = "cartero-http"
description = "Motor de peticiones HTTP de Cartero, con tiempos por fase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cartero-model = { path = "../model" }
tokio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
hickory-resolver = { version = "0.25", features = ["tokio"] }
cookie_store = { version = "0.22", default-features = false, features = ["serde_json", "public_suffix"] }
flate2 = "1"
brotli = "8"
zstd = { version = "0.13", default-features = false }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.9"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mime_guess = "2"

[lints]
workspace = true
