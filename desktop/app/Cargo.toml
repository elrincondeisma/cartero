[package]
name = "cartero-desktop"
description = "Cartero: cliente de APIs de escritorio, nativo en Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cartero"
path = "src/main.rs"

[dependencies]
cartero-model = { path = "../crates/model" }
cartero-http = { path = "../crates/http" }
cartero-script = { path = "../crates/script" }
cartero-runner = { path = "../crates/runner" }
cartero-store = { path = "../crates/store" }
cartero-sync = { path = "../crates/sync" }
gpui-kit = { version = "=0.10.0", default-features = false, features = [
    "component",
    "assets",
    "tree-sitter",
    "tree-sitter-javascript",
    "tree-sitter-html",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-php",
    "tree-sitter-csharp",
] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
open = "5"
sha2 = "0.10"
rand = "0.9"
gethostname = "1"
# Mock local (servidor HTTP en un puerto del equipo)
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "cartero"
maintainer = "Cartero <noreply@cartero.dev>"
section = "devel"
extended-description = "Cliente de APIs de escritorio nativo, de código abierto: colecciones, entornos, scripts pm.*, runner y sincronización opcional con un servidor de Cartero."
depends = "libxkbcommon0, libxkbcommon-x11-0, libvulkan1, libfontconfig1, libwayland-client0, libx11-xcb1"
assets = [
    ["target/release/cartero", "usr/bin/", "755"],
    ["../packaging/linux/cartero.desktop", "usr/share/applications/", "644"],
    ["../packaging/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/cartero.png", "644"],
    ["../packaging/icons/icon-512.png", "usr/share/icons/hicolor/512x512/apps/cartero.png", "644"],
]

[lints]
workspace = true
